dimension_unit: mm
weight_unit: g
scope: Standard 6700 and larger additions 6708 through 6720; existing 6701 through 6707 rows retained.
selection_notes:
  - Dimensions and masses for 6708-6710 follow AST's individual open-bearing listings.
  - Dimensions and masses for 6711-6720 follow C&H's individual 617xx listings, which explicitly cross-reference 67xx. C&H masses converted from kg to g.
  - These are catalogue listings, not confirmations of stock or a universal maximum series size.
  - Manufacturer dimensions differ for some larger 67xx designations; match the cited drawing before substituting brands.
  - The 6700 entry follows AST's standard open 10x15x3 mm listing, checked 2026-10-25; wider closure variants exist.
  - RAYSDE lists 6722, 6724, 6726 and 6730, but its larger 67xx dimensions conflict with the C&H 617xx family. These were not added without corroborating individual product specifications.
