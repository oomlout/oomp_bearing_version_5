oomlout_ai_roboclick_1:
    actions:
    -   command: new_chat
        description: step_1_create_icon
    -   command: ai_query
        delay: '240'
        mode_ai_wait: slow
        text: "## READ THIS FIRST \u2014 no theme is coming in this message, and that\
            \ is correct\n\nThis is **step 1 of 2**. It is deliberately theme-free.\
            \ You are building a reusable house style, not designing a specific logo.\n\
            \nThe theme arrives in step 2. Do **not** ask what the theme is. Do **not**\
            \ ask any clarifying questions. Do **not** write a final image-generation\
            \ prompt yet \u2014 you cannot, and attempting one is a failure of this\
            \ step. Do **not** invent a placeholder theme and design for it. If you\
            \ feel information is missing, that is expected: the missing information\
            \ is the theme, it is coming next, and nothing in this step requires it.\n\
            \nYour entire output for this step is a **house style guide** that will\
            \ be applied to whatever theme arrives next.\n\n---\n\n## The product\
            \ this style serves\n\n**Intended use:** a square, single-colour, pure-black-on-pure-white\
            \ mascot logo, generated as a raster image, then **auto-traced to vector\
            \ and cut/engraved on a laser cutter**. The trace step is unforgiving\
            \ \u2014 it is the hardest constraint in this brief and should shape most\
            \ of your recommendations.\n\n**Target feel:** charming, original, cute,\
            \ polished, instantly readable at ~20 mm. A designed branded icon, not\
            \ a doodle page and not generic kawaii clip art.\n\n---\n\n## What to\
            \ produce\n\nWrite these six sections. **Budget: about 900 words total,\
            \ 1,100 hard ceiling.** That is roughly 100\u2013150 words per section,\
            \ with section 6 allowed the most. This is a working reference, not an\
            \ essay \u2014 every line should be a rule someone could check a drawing\
            \ against. Prefer tight bullets over prose paragraphs, and cut any sentence\
            \ that only restates the brief back at me.\n\n**1. Line language menu**\n\
            Exactly three distinct black-on-white line-art approaches (e.g. uniform\
            \ monoline, weight-varied outline with sparse interior, chunky sticker-outline,\
            \ geometric constructed line). One or two lines each: what it does for\
            \ charm, how it survives auto-tracing, what it costs.\n\n**2. Cuteness\
            \ that isn't generic**\nThe handful of levers that make a line mascot\
            \ lovable \u2014 eye shape and spacing, head-to-body ratio, pose energy,\
            \ mouth simplicity, restraint on blush marks \u2014 each as a one-line\
            \ rule with a number where a number applies. Then a short do-not list\
            \ of the clich\xE9s that make an AI mascot look stock (dead-centre symmetrical\
            \ stare, sparkle confetti, floating hearts, blob bodies), each with its\
            \ one-line replacement.\n\n**3. Trace-safety rules**\nA flat list of concrete,\
            \ checkable rules for the auto-trace-to-cut pipeline \u2014 one line each,\
            \ no explanatory paragraphs:\n- minimum stroke thickness relative to the\
            \ square's width, stated as a fraction (so it scales)\n- minimum gap between\
            \ two adjacent strokes before they blur into one traced blob\n- why every\
            \ shape should read as a closed path, and how to spot one that won't\n\
            - island/floating-part handling and where to add connective bridges\n\
            - what to do about interior detail that a tracer will turn into noise\
            \ (crosshatching, stippling, tapering hairlines, single stray dots)\n\
            - why large solid black fills are avoided here, and the acceptable exceptions\
            \ (small eyes, pupils, a tiny accent shape)\n\n**4. Composition and hierarchy**\n\
            Bulleted rules only: square framing, margin as a fraction of the square,\
            \ centre of visual mass, minimum negative space, the mascot-leads / props-support\
            \ / text-reinforces hierarchy, and the shared traits that make it read\
            \ as one illustrator's hand (same stroke weight, same corner radius, same\
            \ eye style, same spacing rhythm).\n\n**5. Text and badge treatments**\n\
            Text is allowed and okay to include. Briefly: when a word helps versus\
            \ clutters, a maximum letter count that stays cuttable, how to specify\
            \ literal text so it renders verbatim (quotes, exact casing), the letterform\
            \ to ask for, and when a badge ring earns its place versus just boxing\
            \ the mark in. Six bullets is plenty.\n\n**6. Prompt architecture for\
            \ step 2**\nThe most important section, so spend your words here. Specify\
            \ the exact template the step-2 final prompt must follow \u2014 and state\
            \ that the finished prompt should land at **180\u2013250 words**, long\
            \ enough to carry the spec, short enough that no single instruction gets\
            \ diluted. Order it to match how the image model weights a prompt:\n\n\
            1. **Medium and style up front** \u2014 the first sentence states it is\
            \ a square black-and-white line-art mascot logo, because opening words\
            \ set the mode for everything after.\n2. **Subject** \u2014 the mascot,\
            \ its identity, expression, pose.\n3. **Key details** \u2014 props, supporting\
            \ motifs, any literal text in quotes.\n4. **Layout** \u2014 centring,\
            \ margins, hierarchy, where each element sits.\n5. **Line and manufacturing\
            \ spec** \u2014 stroke weight, closed paths, interior-detail limits.\n\
            6. **Exclusions last** \u2014 negatives go at the very end, after every\
            \ positive descriptor, because a model reading them early tends to treat\
            \ them as things to compose rather than things to omit.\n\nGive the canonical\
            \ exclusion list to close with (no grey, no shading, no gradients, no\
            \ halftone, no dithering, no texture, no colour, no transparency, no background\
            \ scene, no drop shadow, no outer glow, no frame border unless specified,\
            \ no watermark, no signature, no extra text beyond what is quoted).\n\n\
            Also state the two facts the prompt must say in plain words no matter\
            \ what: the image is **square**, and it is **pure black on a pure white\
            \ background**.\n\n---\n\n## Response style and length\n\n**About 900\
            \ words, 1,100 absolute maximum.** Bullets over prose. Concrete and checkable\
            \ over abstract and aspirational \u2014 \"stroke no thinner than 1/100\
            \ of the square's width\" beats \"confident lines\". No preamble, no restating\
            \ this brief back at me, no summary of what you are about to do. Skip\
            \ the caveats and the reasoning behind each rule; just state the rule.\n\
            \nClose with a checklist of the rules, 12 lines at most, so step 2 can\
            \ be graded against it.\n\nThen stop. No final image prompt, no questions,\
            \ no theme.\n"
    -   command: ai_query
        delay: '240'
        mode_ai_wait: slow
        text: "## Step 2 of 2 \u2014 the theme\n\nThe theme is: **an image of hardware\
            \ bearing MR series MR106 size 6 mm id 10 mm od 3 mm depth make Hardware\
            \ Bearing Mr Series Mr106 Size 6 Mm Id 10 Mm Od 3 Mm Depth cute, bearing\
            \ size MR106 6x10x3 mm, code hardware_bearing_MR_series_MR106_size_6_mm_id_10_mm_od_3_mm_depth,\
            \ text is okay to include**\n\nApply the house style you just wrote to\
            \ this theme. Everything you need is now in hand. Generate the image during\
            \ this step without asking questions or waiting for another message.\n\
            \n---\n\n## Part A \u2014 private exploration\n\nWork through these choices\
            \ privately before calling the image generation tool. Do not send the\
            \ exploration as a text response. Push past the theme's first obvious\
            \ reading, but do it briskly.\n\n- **Angles:** exactly four mascot interpretations,\
            \ **one or two sentences each**. Include at least one that anthropomorphises\
            \ an object or concept from the theme rather than reaching for the obvious\
            \ animal, and at least one built on a visual pun. Then name your pick\
            \ in a single sentence saying why it beats the other three \u2014 no full\
            \ comparison table.\n- **The chosen design:** one short paragraph fixing\
            \ the pose, expression, props, and line strategy. Prefer gesture or a\
            \ moment of character over a static front-on stare. Cut any prop that\
            \ is decoration rather than signal.\n- **Text:** one line \u2014 the exact\
            \ string in quotes with exact casing, or \"no text\". Text is allowed\
            \ and okay to include when it improves identification.\n- **Trace and\
            \ small-size check:** a short bullet list of fixes only \u2014 every stroke\
            \ to thicken, gap to widen, island to bridge, detail to delete. Just the\
            \ fixes, not the reasoning, and not a description of what the design looks\
            \ like at size.\n\nSkip anything not on that list: no tradeoff essays,\
            \ no runner-up post-mortems, no notes on your own process.\n\n## Part\
            \ B \u2014 generate the image now\n\nWrite the final image-generation\
            \ prompt for the chosen direction and pass it directly to the image generation\
            \ tool in this step. Invoke the tool exactly once. Do not return a text-only\
            \ prompt, a fenced code block, or a plan to generate later. Finish with\
            \ the generated image so it can be saved immediately from the generation\
            \ window.\n\nFollow the six-part architecture from step 1 exactly, in\
            \ order: medium and style \u2192 subject \u2192 key details \u2192 layout\
            \ \u2192 line and manufacturing spec \u2192 exclusions last.\n\n**Length:\
            \ 180\u2013250 words.** Long enough to carry the full spec, short enough\
            \ that no single instruction gets diluted. If you are over, cut adjectives\
            \ and repeated style words before you cut any manufacturing rule.\n\n\
            Hard requirements for that prompt:\n\n- It opens by stating it is a **square\
            \ black-and-white line-art mascot logo**.\n- It says in plain words that\
            \ the image is **square** and **pure black on a pure white background**.\n\
            - It states stroke weight as a fraction of the image width, and requires\
            \ every shape to be a **closed path** with **no floating disconnected\
            \ islands**.\n- It caps interior detail explicitly and forbids crosshatching,\
            \ stippling, and hairline tapers.\n- Any literal text appears in quotes\
            \ with exact casing, spelled out character by character if it is unusual.\n\
            - The exclusion list comes **last**, after every positive descriptor.\n\
            - It is self-contained: someone pasting it cold, with no memory of this\
            \ conversation, gets the same image. No \"as discussed above\", no \"\
            the mascot from earlier\".\n- One image-generation call only. No variants,\
            \ no alternates, and no extra text response after the image.\n"
    -   command: save_image_generated
        file_name: initial_generated.png
        mode_ai_wait: slow
    -   command: close_tab
    file_test: initial_generated.png
    retries_until_complete: 0
